<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><link href=
"https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css" 
        rel="stylesheet">
</head>
<body class="bg-white">
<header class="sticky top-0 bg-indigo-400 text-white p-3 flex justify-between border-b-4">
  
  <a href="#add"class="text-lg text-black font-bold mt-3 border-2 border-black p-1 rounded-2xl xsm:text-xsm md:text-lg  h-20" style="font-size: small; height: auto;">Add Account</a>
  <h1 id="total" class="mt-3 text-center text-black text-3xl font-bold"></h1>
  <div>
  <h1 class="text-3xl text-black font-bold">Accounts Dashboard</h1>
  <p class="text-black text-xl">View details.</p>
  </div>  
</header>
    <div  class="flex  flex-col  justify-between items-center">
        <div class="flex xsm:flex-col lg:flex-row justify-between w-full">
        <h1 class="text-3xl font-bold text-black p-2">Account Details</h1>
        <div class="flex xsm:flex-col w-2/4 justify-between items-center">
        <label for="branch" class="text-2xl  font-bold">Filter </label>
        <select id="branch" style="width: 100px;">
            <option value="All">All</option>
            <option value="Bengaluru">Bengaluru</option>
            <option value="Hyderabad">Hyderabad</option>
            <option value="Delhi">Delhi</option>
            <option value="Mumbai" >Mumbai</option>
        </select>
        <label for="bal" class="text-2xl font-bold">Sort</label>
        <select id="bal" style="width: 100px;">
            <option >Sort</option>
            <option value="High">High</option>
            <option value="Low">Low</option>
        </select>
        </div>
        
        <div class="flex gap-4  xsm:flex-col justify-between items-center">
        <label for="branch" class="text-2xl font-bold h-12">Search</label>
        <input id="search" placeholder="Search name" class="border p-2 h-12">
        </div>
        </div>
        <div id="loader" class="fixed inset-0 bg-white/70 flex items-center justify-center z-50 hidden">
        <div class="h-14 w-14 border-4 border-gray-300 border-t-yellow-400 rounded-full animate-spin"></div>
        </div>

        <ul id="accounts" style="display: flex;align-items: center; flex-wrap:wrap;justify-content:space-between;"></ul>
        <h1 id="main" class="text-2xl font-bold"></h1>
        <section id="add" class="flex flex-col  items-center sm:w-2/3 w-2/3">
        <div id="contact" class="bg-indigo-400 flex flex-col items-center p-2 m-2  border-1 rounded-2xl xsm:w-5/6 md:w-2/3">
        <h1 class="text-xl font-bold mt-2">Add Bank Account</h1>
        <form class="w-72 block" id="form">
        <label class="text-md font-bold mt-2" for="name">Holder Name</label>
        <input id="name" type="text" placeholder="Enter Holder name"  required class="border-2 border-black w-full"/><br/>
        <label class="text-md font-bold mt-2" for="email">Email ID</label>
        <input id="email" type="email" placeholder="Enter Email" required class="border-2 border-black w-full"/><br/>
        <label class="text-md font-bold mt-2" for="branch">Branch</label>
        <select id="branch1" style="width: 100px;"class="w-full mb-2">
            <option >Select</option>
            <option value="Bengaluru">Bengaluru</option>
            <option value="Hyderabad">Hyderabad</option>
            <option value="Delhi">Delhi</option>
            <option value="Mumbai" >Mumbai</option>
        </select><br/>
    <button class="bg-yellow-400 w-36 ml-16 rounded-2xl" type="submit">Submit</button>
    <p id="successmsg"></p>
  </form>
    </div>
    </section>
    <section id="history" class="w-2/3 mx-auto mt-10 hidden">
    <h2 class="text-2xl font-bold mb-4">Transaction History</h2>
    <table class="w-full border border-black text-center">
    <thead class="bg-indigo-400 text-white">
      <tr>
        <th class="border p-2">Date</th>
        <th class="border p-2">Type</th>
        <th class="border p-2">Amount</th>
      </tr>
    </thead>
    <tbody id="historycon"></tbody>
  </table>
</section>
    </div>
    <script src="main.js"></script>
</body>
</html>

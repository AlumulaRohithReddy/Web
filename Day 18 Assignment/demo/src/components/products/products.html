<div class="p-5">

    <div class="flex flex-col justify-center items-center border-2 rounded-xl w-auto p-4 h-64 m-5">
        <h1 class="text-2xl font-bold">{{product}}</h1>
        <h3>Rate the Product</h3>
        <label>
            Rating:</label>
        <div class="text-3xl cursor-pointer flex ">
        @for (star of stars; track star) {
  <span
    (click)="rate(star, star-1)"
    [class.filled]="star <= rating">
    ★
  </span>
 
}
</div>
<p class="result">
    ⭐ Rating given: {{ rating }}/5
  </p>

</div>

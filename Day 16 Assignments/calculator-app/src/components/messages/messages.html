<div class="p-6 w-1/2 mt-3 h-auto border-1 rounded-xl shadow-sm shadow-red-800">
    <h1 class=" text-xl w-64 text-center font-bold mb-3 bg-amber-300 p-2 rounded-xl">Available Messages</h1>
    <button class="border-1 rounded-xl w-3/7 cursor-pointer bg-amber-300 mb-5" (click)="getData()">Click to See</button>
    <div class="flex flex-row justify-around border-2 p-3 rounded-xl flex-wrap">
        @for(s of strings;track s ){
            <h2 class=" text-md w-auto text-center font-bold bg-blue-200 p-2 rounded-xl">{{s}}</h2>
        }
    </div>
    <h2 class=" text-xl w-64 text-center font-bold" >Want to Add a Messages</h2>
    <input class="border-1 w-2/3 p-1 m-2 rounded-xl" type="text" [(ngModel)]="m"/>
    <button class="border-1 rounded-xl w-3/7 cursor-pointer bg-amber-300 mb-5" (click)="add(m)">Add</button>
</div>

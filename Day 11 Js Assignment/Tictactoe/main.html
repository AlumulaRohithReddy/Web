<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe Game</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body >
  <div class="bg-blue-300 min-h-screen flex items-center justify-center">
  <div class="bg-blue-800 p-8 rounded-xl shadow-xl w-96 text-center">
    <h1 class="text-3xl font-bold text-white mb-4">Tic Tac Toe</h1>
    <p id="status" class="text-xl text-white mb-4">
      Player X's turn
    </p>
    <div class="grid grid-cols-3 gap-3 mb-6">
  <button class="cell h-24 text-4xl font-bold text-black bg-blue-200 hover:bg-blue-300 rounded-lg flex items-center justify-center"></button>
  <button class="cell h-24 text-4xl font-bold text-black bg-blue-200 hover:bg-blue-300 rounded-lg flex items-center justify-center"></button>
  <button class="cell h-24 text-4xl font-bold text-black bg-blue-200 hover:bg-blue-300 rounded-lg flex items-center justify-center"></button>
  <button class="cell h-24 text-4xl font-bold text-black bg-blue-200 hover:bg-blue-300 rounded-lg flex items-center justify-center"></button>
  <button class="cell h-24 text-4xl font-bold text-black bg-blue-200 hover:bg-blue-300 rounded-lg flex items-center justify-center"></button>
  <button class="cell h-24 text-4xl font-bold text-black bg-blue-200 hover:bg-blue-300 rounded-lg flex items-center justify-center"></button>
  <button class="cell h-24 text-4xl font-bold text-black bg-blue-200 hover:bg-blue-300 rounded-lg flex items-center justify-center"></button>
  <button class="cell h-24 text-4xl font-bold text-black bg-blue-200 hover:bg-blue-300 rounded-lg flex items-center justify-center"></button>
  <button class="cell h-24 text-4xl font-bold text-black bg-blue-200 hover:bg-blue-300 rounded-lg flex items-center justify-center"></button>
 </div>

    <button id="restart" class="bg-red-400 hover:bg-yellow-500 text-black font-bold px-4 py-2 rounded-lg w-full">
      Restart Game
    </button>
  </div>
  </div>
  <script src='main.js'></script>

</body>
</html>

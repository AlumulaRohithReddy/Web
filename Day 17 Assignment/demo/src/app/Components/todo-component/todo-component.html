<div class="min-h-screen bg-gray-100 p-6">
  <h1 #u class="text-3xl font-bold text-center mb-8 text-gray-800">
    User List
  </h1>
  @defer (on hover(u)){
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    @for(u of users;track $index){
    <div class="bg-white rounded-xl shadow-md p-6 hover:shadow-xl transition"
    >
      <h2 class="text-xl font-semibold text-gray-900 mb-2">
        {{ u.name }}
      </h2>
      <p class="text-gray-600 text-sm mb-1">
        <span class="font-medium">Email:</span> {{ u.email }}
      </p>
      <p class="text-gray-600 text-sm mb-1">
        <span class="font-medium">Age:</span> {{ u.age }}
      </p>

      <p class="text-gray-600 text-sm mb-3">
        <span class="font-medium">Role:</span> {{ u.role }}
      </p>

      <span
        class="inline-block px-3 py-1 text-sm font-semibold rounded-full"
      >
        {{ u.isActive ? 'Active' : 'Inactive' }}
      </span>
      <button (click)="delete(u.id)" class="bg-amber-400 w-36 rounded-xl border-1">Delete</button>
      <button (click)="editUser(u)" class="bg-amber-400 w-36 rounded-xl border-1">edit</button>
    </div>
    }
  </div>
}
</div>
<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <form
    class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md"
    (ngSubmit)="saveUser()">

    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
      User Form
    </h2>
    <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-1">Name</label>
      <input
        type="text"
        [(ngModel)]="data.name"
        name="name"
        required
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
      />
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-1">Email</label>
      <input
        type="email"
        [(ngModel)]="data.email"
        name="email"
        required
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
      />
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-1">Age</label>
      <input
        type="number"
        [(ngModel)]="data.age"
        name="age"
        min="1"
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
      />
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-1">Role</label>
      <select
        [(ngModel)]="data.role"
        name="role"
        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
      >
        <option value="">Select role</option>
        <option>Student</option>
        <option>Developer</option>
        <option>Designer</option>
        <option>Tester</option>
      </select>
    </div>
    <div class="mb-6">
      <label class="block text-gray-700 font-medium mb-1">Status</label>
      <div class="flex items-center gap-4">
        <label class="flex items-center gap-2">
          <input
            type="radio"
            name="isActive"
            [value]="true"
            [(ngModel)]="data.isActive"
          />
          Active
        </label>

        <label class="flex items-center gap-2">
          <input
            type="radio"
            name="isActive"
            [value]="false"
            [(ngModel)]="data.isActive"
          />
          Inactive
        </label>
      </div>
    </div>
    <button
      type="submit"
      class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition"
    >
     {{ data.id ? 'Update User' : 'Save User' }}
    </button>
  </form>
</div>
